<!DOCTYPE html>
<html>
<head>
    <title>{{ car['brand'] }} {{ car['model'] }} - Car Details</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .details {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }

        .details-image img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 10px;
        }

        .details-info h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .details-info h2 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .details-info p {
            font-size: 18px;
            margin: 12px 0;
        }

        @media (max-width: 700px) {
            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">CAR SHOWROOM</div>

    <nav>
        <a href="/">Home</a>
        <a href="/cars">Cars</a>
    </nav>
</header>


<section class="details">

    <div class="details-image">

        <img src="{{ url_for('static', filename='images/' + car['image']) }}"
             alt="{{ car['brand'] }} {{ car['model'] }}">

    </div>


    <div class="details-info">

        <h1>{{ car['brand'] }} {{ car['model'] }}</h1>

        <h2>₹{{ car['price'] }}</h2>

        <p>
            <strong>Fuel:</strong>
            {{ car['fuel'] }}
        </p>

        <p>
            <strong>Transmission:</strong>
            {{ car['transmission'] }}
        </p>

        <p>
            <strong>Year:</strong>
            {{ car['year'] }}
        </p>
<a href="/booking?car_id={{ car['id'] }}" class="btn">
    Book Now
</a>
    </div>

</section>

</body>
</html>
