<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="logo">CAR SHOWROOM - ADMIN</div>

   <nav>
    <a href="/">Home</a>
    <a href="/cars">Cars</a>
    <a href="/manage-cars">Manage Cars</a>
    <a href="/admin-bookings">Bookings</a>
    <a href="/logout">Logout</a>
</nav>
</header>

<section class="admin">

    <h1>Booking Dashboard 📊</h1>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Customer Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Car</th>
                <th>Booking Type</th>
            </tr>
        </thead>

        <tbody>

            {% for booking in bookings %}

            <tr>
                <td>{{ booking[0] }}</td>
                <td>{{ booking[1] }}</td>
                <td>{{ booking[2] }}</td>
                <td>{{ booking[3] }}</td>
                <td>{{ booking[4] }}</td>
                <td>{{ booking[5] }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</section>

</body>
</html>
